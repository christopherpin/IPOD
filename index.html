<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Albums</title>
<style>
:root{ --rank:#ffd400; --rank-dark:#947b00; --text-dark:#878788; --bg:#0b0b0c; --tile:#161618; --text:#e9e9ea; --muted:#8a8a90; --accent:#1ed760; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px;padding:4px}
.wall img{opacity:0;transition:opacity .4s;display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--tile)}
.setup{position:fixed;inset:0;z-index:5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.setup form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.setup input,.setup button{font:inherit;color:inherit;border-radius:999px;padding:10px 16px;border:1px solid #2a2a2e;background:var(--tile)}
.setup button{background:var(--accent);color:#04170a;border-color:var(--accent);font-weight:600;cursor:pointer}
.setup p{margin:0;color:var(--muted);font-size:12px;text-align:center}
.hidden{display:none !important}

/* view switcher */
.views{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(22,22,24,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.views button{font:600 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.views button.on{color:var(--text);background:#2a2a2e}

/* decades: one column per decade, loops left/right, each column scrolls on its own */
body.decade-view{overflow:hidden}
.decades{--colw:clamp(150px,44vw,240px);position:fixed;inset:0;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior:none}
.decades::-webkit-scrollbar,.col::-webkit-scrollbar{display:none}
.col{flex:0 0 var(--colw);height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior-y:contain}
.col h2{position:sticky;top:0;z-index:2;height:54px;margin:0;padding:0;background:var(--bg);overflow:hidden;font:700 26px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;cursor:pointer;user-select:none;transition:color .15s}
/* the year is stretched a little past every edge of its cell, so the cell clips it slightly on all four sides */
.col h2 svg{position:absolute;left:-3%;top:-5%;width:106%;height:110%;fill:currentColor;overflow:visible}
.col.rank h2{color:var(--rank)}
/* the first two digits are a darker shade of the title colour (grey on white, dark yellow on yellow) */
.col h2 .cent{fill:var(--text-dark)}
.col.rank h2 .cent{fill:var(--rank-dark)}
.tiles{display:flex;flex-direction:column;gap:4px;padding-bottom:64px}
.wall img.in{opacity:1}
.tiles img,.ghost{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--tile);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
.col.rank .tiles img{cursor:grab}
.tiles img.placeholder{opacity:.15}
.ghost{position:fixed;z-index:30;pointer-events:none;cursor:grabbing;box-shadow:0 18px 40px rgba(0,0,0,.6);transform:scale(1.04);transition:transform .12s}
.menu{position:fixed;z-index:40;padding:4px;border-radius:8px;background:var(--rank);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu button{display:block;font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#000;background:none;border:0;border-radius:5px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.menu button:hover{background:rgba(0,0,0,.1)}
/* pantheon: a numbered 1-100 grid, ten to a row, with a queue of albums waiting to be placed */
.pantheon{padding:4px 4px 72px}
.pqueue{margin-bottom:12px;padding:4px;border-radius:4px}
.pqueue h3{margin:6px 2px 8px;font:700 12px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pq,.pgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pq img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--tile)}
.pslot{position:relative;aspect-ratio:1;background:var(--tile);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pslot span{font:700 clamp(10px,1.8vw,22px)/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#3a3a40;user-select:none}
.pslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pslot.filled span{position:absolute;top:5px;left:6px;z-index:1;color:#fff;font-size:clamp(9px,1.1vw,14px);text-shadow:0 1px 3px rgba(0,0,0,.9)}
.pq img,.pslot img{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
.pq img.placeholder,.pslot img.placeholder{opacity:.15}
.pslot.over,.pqueue.over{outline:2px solid var(--rank);outline-offset:-2px}
.empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
/* queue: albums you want to hear, found with one search bar that looks beyond Spotify */
.queue{padding:0 4px 72px}
.qbar{position:sticky;top:0;z-index:3;display:flex;justify-content:center;padding:14px 12px;background:var(--bg)}
.qbar input{width:100%;max-width:520px;font:inherit;font-size:15px;color:var(--text);background:var(--tile);border:1px solid #2a2a2e;border-radius:999px;padding:11px 18px;outline:none}
.qbar input:focus{border-color:#3a3a40}
.qbar input::placeholder{color:var(--muted)}
.qnote{margin:28px 0;text-align:center;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px}
.qres{gap:14px 4px}
.qtile{position:relative;display:block;aspect-ratio:1;background:var(--tile);overflow:hidden;cursor:pointer;user-select:none}
.qtile i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font:600 13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-style:normal;color:var(--muted)}
.qtile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;-webkit-user-drag:none}
.qtile img.in{opacity:1}
.qtile b{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--rank);color:#000;font:700 13px/22px system-ui,sans-serif;text-align:center;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.qtile.on b{opacity:1;transform:none}
.qcap{margin-top:6px;padding:0 2px;line-height:1.3;cursor:pointer}
.qcap div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcap .sub{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="setup hidden" id="setup">
  <form id="form">
    <input id="clientId" placeholder="Spotify Client ID" autocomplete="off" spellcheck="false">
    <button type="submit">Connect Spotify</button>
    <p id="msg"></p>
    <p id="help">Get a Client ID: open <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener" style="color:var(--accent)">developer.spotify.com/dashboard</a>, create an app, tick Web API, and add the Redirect URI <b id="redir"></b>. Then copy the app's Client ID here.</p>
  </form>
</div>
<p class="empty hidden" id="loading">Loading…</p>
<main class="wall" id="wall"></main>
<main class="decades hidden" id="decades"></main>
<main class="pantheon hidden" id="pantheon"></main>
<main class="wall hidden" id="wax"></main>
<main class="queue hidden" id="queue">
  <div class="qbar"><input id="qsearch" type="search" placeholder="Search for an album" autocomplete="off" spellcheck="false"></div>
  <div id="qbody"></div>
</main>
<div class="setup hidden" id="waxSetup">
  <form id="waxForm">
    <input id="waxUser" placeholder="Discogs username" autocomplete="off" spellcheck="false">
    <button type="submit">Show my records</button>
    <p id="waxMsg"></p>
  </form>
</div>
<div class="menu hidden" id="menu">
  <button data-act="top">Send To Top 10</button>
  <button data-act="end">Send To End</button>
  <button data-act="pantheon">Send To Pantheon</button>
</div>
<div class="menu hidden" id="qmenu">
  <button data-act="first">Move To Front</button>
  <button data-act="remove">Remove From Queue</button>
</div>
<nav class="views hidden" id="views">
  <button data-view="wall">Wall</button>
  <button data-view="decades">Decades</button>
  <button data-view="pantheon">Pantheon</button>
  <button data-view="wax">Wax</button>
  <button data-view="queue">Queue</button>
</nav>

<script>
"use strict";
const LS = {
  get(k, d=null){ try{ const v = localStorage.getItem("wall."+k); return v==null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("wall."+k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem("wall."+k); }catch{} }
};
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const CLIENT_ID = "813caa88dc414f8b8c3dd58c09e55c9f"; // set to your Spotify app's Client ID to skip typing it
const REDIRECT = location.origin + location.pathname;
const SCOPES = "user-read-recently-played user-top-read user-library-read";

/* ---------- auth (PKCE) ---------- */
function b64url(bytes){ return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function startLogin(clientId){
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(64)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  LS.set("verifier", verifier); LS.set("state", state); LS.set("clientId", clientId);
  const p = new URLSearchParams({ client_id: clientId, response_type: "code", redirect_uri: REDIRECT,
    code_challenge_method: "S256", code_challenge: challenge, scope: SCOPES, state });
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
async function tokenRequest(params){
  const r = await fetch("https://accounts.spotify.com/api/token", { method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body: new URLSearchParams(params) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.error || "Token request failed");
  const prev = LS.get("token", {});
  const tok = { access: j.access_token, refresh: j.refresh_token || prev.refresh, exp: Date.now() + (j.expires_in - 60) * 1000 };
  LS.set("token", tok); return tok;
}
async function handleRedirect(){
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return;
  history.replaceState(null, "", REDIRECT);
  if (q.get("error")) throw new Error("Spotify said: " + q.get("error"));
  if (q.get("state") !== LS.get("state")) throw new Error("Login state mismatch, please try again.");
  await tokenRequest({ grant_type:"authorization_code", code:q.get("code"), redirect_uri:REDIRECT,
    client_id:LS.get("clientId"), code_verifier:LS.get("verifier") });
  LS.del("verifier"); LS.del("state");
}
async function accessToken(){
  let t = LS.get("token");
  if (!t) return null;
  if (Date.now() > t.exp && t.refresh) t = await tokenRequest({ grant_type:"refresh_token", refresh_token:t.refresh, client_id:LS.get("clientId") });
  return t.access;
}
async function api(path, tries=0){
  const tok = await accessToken();
  const r = await fetch(path.startsWith("http") ? path : "https://api.spotify.com/v1" + path, { headers:{ Authorization:"Bearer "+tok } });
  if (r.status === 429 && tries < 4){ await sleep((+r.headers.get("Retry-After") || 2) * 1000); return api(path, tries+1); }
  if (r.status === 401 && tries < 1){ const t = LS.get("token"); if (t){ t.exp = 0; LS.set("token", t); } return api(path, tries+1); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok){ const e = new Error((j.error && j.error.message) || ("Spotify error " + r.status)); e.status = r.status; throw e; }
  return j;
}

/* ---------- the wall ---------- */
let albums = []; // every album on the wall, in wall order (shared by the wall and Decades)
const CACHE = "albums.v1";
// remasters, deluxe and anniversary editions of the same album share one key, so each album shows once
const albumKey = a => norm(cleanTitle(a.name || "")) + "|" + norm((a.artists || [])[0]?.name || "");
const isReissue = name => cleanTitle(name) !== name.trim();
// the original wins over a reissue; among originals (or among reissues) the earliest wins
const better = (x, y) => isReissue(x.name) !== isReissue(y.name) ? !isReissue(x.name) : (x.released || 9999) < (y.released || 9999);
// Builds the album list as Spotify pages arrive: singles are skipped and other editions of an
// album folded in on the spot, so the finished list is already clean.
function collector(){
  const seen = new Set(), byKey = new Map(), list = [];
  return { list, add(items){
    for (const a of items){
      if (!a || !a.id || seen.has(a.id)) continue;
      // albums, EPs and compilations only: Spotify calls EPs "singles" too, but a real single has 1 to 3 tracks
      if (a.album_type === "single" && (a.total_tracks || 0) <= 3) continue;
      seen.add(a.id);
      const imgs = a.images || [];
      const src = (imgs.find(i => i.width && i.width <= 320 && i.width >= 250) || imgs[0] || {}).url;
      if (!src) continue;
      const year = parseInt((a.release_date || "").slice(0, 4), 10);
      const version = { src, title: a.name + " · " + (a.artists || []).map(x => x.name).join(", "), name: a.name || "",
        released: year > 1000 ? year : null, date: a.release_date || "", fromTitle: titleYear(a.name || "") };
      const key = albumKey(a), same = byKey.get(key);
      if (same){
        // another version of an album we already have: keep whichever is the original
        same.ids.push(a.id);
        if (better(version, same)){
          Object.assign(same, version);
          settleYear(same);
        }
        continue;
      }
      const al = { id: a.id, ids: [a.id], artist: (a.artists || [])[0]?.name || "", ...version };
      settleYear(al);
      byKey.set(key, al);
      list.push(al);
    }
  } };
}
function fillGrid(el, list){
  const frag = document.createDocumentFragment();
  for (const a of list){
    const img = document.createElement("img");
    img.src = a.src; img.loading = "lazy"; img.alt = ""; img.title = a.title; img.dataset.id = a.id;
    img.onload = () => img.classList.add("in");
    frag.appendChild(img);
  }
  el.replaceChildren(frag);
}
const renderWall = () => fillGrid($("#wall"), albums);
/* ---------- pantheon: your top 100, placed by hand ---------- */
// slots: 100 places (album id or null); queue: albums sent to the Pantheon but not placed yet
function pantheon(){
  let slots = LS.get("pantheon.slots"), queue = LS.get("pantheon.queue");
  if (!Array.isArray(slots)) slots = Array(100).fill(null);
  if (!Array.isArray(queue)) queue = LS.get("pantheon", []); // albums sent before the grid existed
  return { slots, queue };
}
function savePantheon(p){ LS.set("pantheon.slots", p.slots); LS.set("pantheon.queue", p.queue); LS.del("pantheon"); }
// Spotify albums sent from Wax that aren't among your own albums, kept so the Pantheon can show them
const extras = () => LS.get("pantheon.extra", {});
const byAnyId = id => albums.find(a => a.ids.includes(id)) || extras()[id];
const inPantheon = a => { const p = pantheon(); return [...p.slots, ...p.queue].some(id => id && a.ids.includes(id)); };
function cover(id){
  const a = byAnyId(id);
  if (!a) return null;
  const img = document.createElement("img");
  img.src = a.src; img.alt = ""; img.title = a.title; img.dataset.id = a.id; img.draggable = false;
  return img;
}
function renderPantheon(){
  const { slots, queue } = pantheon();
  const root = $("#pantheon"), frag = document.createDocumentFragment();
  const q = document.createElement("section");
  q.className = "pqueue"; q.dataset.zone = "queue";
  q.innerHTML = "<h3>Queue</h3>";
  const qg = document.createElement("div"); qg.className = "pq";
  for (const id of queue){ const img = cover(id); if (img) qg.appendChild(img); }
  q.appendChild(qg);
  if (!qg.childElementCount) q.classList.add("hidden");
  frag.appendChild(q);
  const grid = document.createElement("div"); grid.className = "pgrid";
  slots.forEach((id, i) => {
    const slot = document.createElement("div");
    slot.className = "pslot"; slot.dataset.slot = i;
    slot.innerHTML = `<span>${i + 1}</span>`;
    const img = id && cover(id);
    if (img){ slot.classList.add("filled"); slot.appendChild(img); }
    grid.appendChild(slot);
  });
  frag.appendChild(grid);
  root.replaceChildren(frag);
}
// drag an album from the queue or a place onto another place (swapping if it's taken) or back to the queue
let ppending = null, pdrag = null;
$("#pantheon").addEventListener("pointerdown", e => {
  const img = e.target.closest(".pq img, .pslot img");
  if (!img || e.button > 0 || pdrag) return;
  if (e.pointerType === "mouse") e.preventDefault();
  const p = ppending = { img, x: e.clientX, y: e.clientY, touch: e.pointerType !== "mouse" };
  if (p.touch) p.timer = setTimeout(() => { if (ppending === p) pbegin(p); }, 300);
});
addEventListener("pointermove", e => {
  if (pdrag){ pmove(e.clientX, e.clientY); return; }
  if (!ppending) return;
  if (Math.hypot(e.clientX - ppending.x, e.clientY - ppending.y) > 6){
    if (ppending.touch){ clearTimeout(ppending.timer); ppending = null; }
    else pbegin(ppending, e.clientX, e.clientY);
  }
});
addEventListener("pointerup", pend);
addEventListener("pointercancel", pend);
document.addEventListener("touchmove", e => { if (pdrag) e.preventDefault(); }, { passive: false });
function pbegin(p, x = p.x, y = p.y){
  ppending = null;
  const r = p.img.getBoundingClientRect(), ghost = p.img.cloneNode();
  ghost.className = "ghost";
  Object.assign(ghost.style, { width: r.width + "px", height: r.height + "px" });
  document.body.appendChild(ghost);
  p.img.classList.add("placeholder");
  const slot = p.img.closest(".pslot");
  pdrag = { img: p.img, ghost, w: r.width, h: r.height, from: slot ? +slot.dataset.slot : "queue", over: null };
  pmove(x, y);
  // hold an album near the top or bottom of the window to scroll the page
  const edge = () => {
    if (!pdrag) return;
    const y = pdrag.y, m = 70;
    if (y < m) scrollBy(0, -Math.ceil((m - y) / 4));
    else if (y > innerHeight - m) scrollBy(0, Math.ceil((y - innerHeight + m) / 4));
    pmove(pdrag.x, pdrag.y);
    requestAnimationFrame(edge);
  };
  requestAnimationFrame(edge);
}
function pmove(x, y){
  pdrag.x = x; pdrag.y = y;
  const { ghost, w, h } = pdrag;
  ghost.style.left = x - w / 2 + "px"; ghost.style.top = y - h / 2 + "px";
  const under = document.elementFromPoint(x, y);
  const zone = under && (under.closest(".pslot") || under.closest(".pqueue"));
  if (zone !== pdrag.over){ pdrag.over?.classList.remove("over"); zone?.classList.add("over"); pdrag.over = zone; }
}
function pend(){
  if (ppending){ clearTimeout(ppending.timer); ppending = null; }
  if (!pdrag) return;
  const { img, ghost, from, over } = pdrag;
  pdrag = null;
  ghost.remove(); over?.classList.remove("over"); img.classList.remove("placeholder");
  if (!over) return;
  const p = pantheon(), id = img.dataset.id;
  const take = () => { if (from === "queue") p.queue = p.queue.filter(x => !byAnyId(id)?.ids.includes(x)); else p.slots[from] = null; };
  if (over.dataset.zone === "queue"){
    if (from === "queue") return;
    take(); p.queue.push(id);
  } else {
    const to = +over.dataset.slot;
    if (to === from) return;
    const there = p.slots[to];
    take();
    p.slots[to] = id;
    if (there){ if (from === "queue") p.queue.unshift(there); else p.slots[from] = there; } // swap
  }
  savePantheon(p); renderPantheon();
}
// called once, after the last album has arrived
function ready(){
  loaded = true;
  $("#loading").classList.add("hidden");
  renderWall();
  if (view === "decades") renderDecades();
  if (view === "pantheon") renderPantheon();
}
const safe = p => api(p).catch(e => { if (e.status === 401 || e.status === 403) throw e; return null; });

// run fn over items, a few at a time, keeping results in order
async function pool(items, n, fn){
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length){ const k = i++; out[k] = await fn(items[k]); } }));
  return out;
}
async function load(col){
  // ask Spotify for everything at once rather than one page after another
  const recentP = safe("/me/player/recently-played?limit=50");
  const topsP = Promise.all(["short_term", "medium_term", "long_term"].flatMap(r => [
    safe(`/me/top/tracks?time_range=${r}&limit=50`),
    safe(`/me/top/tracks?time_range=${r}&limit=50&offset=49`)
  ]));
  const first = await safe("/me/albums?limit=50");
  const offsets = [];
  for (let o = 50; o < (first?.total || 0); o += 50) offsets.push(o);
  const restP = pool(offsets, 6, o => safe(`/me/albums?limit=50&offset=${o}`));

  // then add them in wall order: 1. last 50 plays, newest first
  const recent = await recentP;
  col.add((recent?.items || []).sort((a, b) => b.played_at.localeCompare(a.played_at)).map(i => i.track?.album));
  // 2. top tracks: 4 weeks, 6 months, all time
  for (const p of await topsP) col.add((p?.items || []).map(t => t.album));
  // 3. saved albums, most recently saved first
  for (const p of [first, ...await restP]) col.add((p?.items || []).map(i => i.album));
}

/* ---------- original release years ---------- */
// Spotify dates a reissue by the reissue ("Remastered 2019"); a year in the title
// ("On Guitar 1955-1962") wins when it's earlier.
const REISSUE = /remaster|deluxe|edition|anniversary|expanded|reissue|version|mono|stereo|bonus|re-?mix|legacy|collector|explicit|clean|special|super|complete|definitive|platinum|extended/i;
function cleanTitle(t){
  return t.replace(/\s*[(\[]([^)\]]*)[)\]]/g, (m, inner) => REISSUE.test(inner) ? "" : m)
          .replace(/\s+[-\u2013\u2014:]\s+[^-\u2013\u2014:]*$/, m => REISSUE.test(m) ? "" : m)
          .replace(/\s+(super\s+)?(deluxe|expanded|remastered)(\s+(edition|version))?$/i, "").trim();
}
function titleYear(t){
  const c = cleanTitle(t);
  if (/^\W*\d{4}\W*$/.test(c)) return null; // an album simply called "1989" is a name, not a date
  const ys = (c.match(/\b(19\d\d|20[0-2]\d)\b/g) || []).map(Number);
  return ys.length ? Math.min(...ys) : null;
}
function settleYear(a){
  const ys = [a.released, a.fromTitle].filter(y => y > 1000);
  const before = a.year;
  a.year = ys.length ? Math.min(...ys) : null;
  return a.year !== before;
}
const norm = s => s.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/&/g, "and").replace(/[^a-z0-9]+/g, " ").trim();
/* ---------- wax: the vinyl in your Discogs collection ---------- */
// The IPOD Discogs app's key and secret (same as discogs.js): they read public data only and
// can't see or change anyone's account, so the collection must be set to public in Discogs.
const DISCOGS = "key=RHSqiCtFLCKBYTeUotje&secret=ERZrvUHMFzVXbKQLUQMQylUFJEkzEcuG";
const WAX = "wax.v1";
async function discogsVinyl(user){
  const out = [];
  for (let page = 1, pages = 1; page <= pages; ){
    const r = await fetch(`https://api.discogs.com/users/${encodeURIComponent(user)}/collection/folders/0/releases` +
      `?per_page=100&page=${page}&sort=added&sort_order=desc&${DISCOGS}`);
    if (r.status === 429){ await sleep(5000); continue; }
    if (r.status === 404) throw new Error("Couldn't find that Discogs username.");
    if (r.status === 401 || r.status === 403) throw new Error("That collection is private. In Discogs, open Settings, then Privacy, and make your collection public.");
    if (!r.ok) throw new Error("Discogs didn't answer. Try again in a minute.");
    const j = await r.json();
    pages = j.pagination?.pages || 1; page++;
    for (const it of j.releases || []){
      const b = it.basic_information || {};
      if (!(b.formats || []).some(f => /vinyl/i.test(f.name || ""))) continue; // records only
      const src = b.cover_image || b.thumb;
      if (!src || /spacer\.gif/.test(src)) continue;
      const artists = (b.artists || []).map(a => (a.name || "").replace(/\s\(\d+\)$/, "")).join(", ");
      out.push({ id: "dg" + it.instance_id, src, title: (b.title || "") + " · " + artists, album: b.title || "", artist: artists });
    }
  }
  return out;
}
let waxRefreshed = false;
const DISCOGS_USER = "christopherpinradoi"; // whose records Wax shows unless another username is typed in

/* ---------- queue: albums you want to hear, found anywhere ---------- */
// One search asks Spotify, Apple Music (iTunes), Discogs and MusicBrainz at once. Nothing is drawn
// until every source has answered (or given up), then the results appear once, merged and in order.
const QUEUE = "queue";
const queueList = () => { const q = LS.get(QUEUE); return Array.isArray(q) ? q : []; };
const artistKey = s => norm(s.replace(/\s\(\d+\)$/, "").replace(/\*$/, "")).replace(/^the /, "");
const resultKey = (name, artist) => norm(cleanTitle(name)) + "|" + artistKey(artist);
const yearOf = d => { const y = parseInt(String(d || "").slice(0, 4), 10); return y > 1000 ? y : null; };
const within = (p, ms = 7000) => Promise.race([p, sleep(ms).then(() => [])]).catch(() => []);
function jsonp(url){
  return new Promise((res, rej) => {
    const cb = "_q" + Math.random().toString(36).slice(2), s = document.createElement("script");
    window[cb] = j => { window[cb] = () => {}; s.remove(); res(j); };
    s.onerror = () => { s.remove(); rej(new Error("failed")); };
    s.src = url + "&callback=" + cb;
    document.head.appendChild(s);
  });
}
async function fromSpotify(q){
  if (!LS.get("token")) return [];
  const j = await api("/search?type=album&limit=10&q=" + encodeURIComponent(q));
  return (j.albums?.items || []).filter(a => a && !(a.album_type === "single" && (a.total_tracks || 0) <= 3)).map(a => {
    const imgs = a.images || [];
    return { name: a.name || "", artist: (a.artists || [])[0]?.name || "", year: yearOf(a.release_date), source: "spotify",
      src: (imgs.find(i => i.width && i.width <= 320 && i.width >= 250) || imgs[0] || {}).url || "", url: a.external_urls?.spotify || "" };
  });
}
async function fromItunes(q){
  // Apple's search doesn't allow other sites to read it directly, so it's loaded the old way, as a script
  const j = await jsonp("https://itunes.apple.com/search?media=music&entity=album&limit=25&term=" + encodeURIComponent(q));
  return (j.results || []).filter(a => a.collectionName && !/\s-\sSingle$/.test(a.collectionName)).map(a => ({
    name: a.collectionName.replace(/\s-\sEP$/, ""), artist: a.artistName || "", year: yearOf(a.releaseDate), source: "itunes",
    src: (a.artworkUrl100 || "").replace("100x100bb", "600x600bb"), url: a.collectionViewUrl || "" }));
}
async function fromDiscogs(q){
  const r = await fetch(`https://api.discogs.com/database/search?type=master&per_page=20&q=${encodeURIComponent(q)}&${DISCOGS}`);
  if (!r.ok) return [];
  return ((await r.json()).results || []).map(m => {
    const [artist, ...rest] = (m.title || "").split(" - ");
    const src = m.cover_image && !/spacer\.gif/.test(m.cover_image) ? m.cover_image : "";
    return { name: rest.join(" - ") || artist, artist: rest.length ? artist.replace(/\s\(\d+\)$/, "").replace(/\*$/, "") : "",
      year: yearOf(m.year), source: "discogs", src, url: m.uri ? "https://www.discogs.com" + m.uri : "" };
  });
}
async function fromMusicBrainz(q){
  const t = q.replace(/[+\-&|!(){}[\]^"~*?:\\\/]/g, " ").trim();
  if (!t) return [];
  const query = `(releasegroup:(${t}) OR artistname:(${t})) AND (primarytype:album OR primarytype:ep)`;
  const r = await fetch("https://musicbrainz.org/ws/2/release-group?fmt=json&limit=20&query=" + encodeURIComponent(query));
  if (!r.ok) return [];
  return ((await r.json())["release-groups"] || []).filter(g => (g.score || 0) >= 70).map(g => ({
    name: g.title || "", artist: (g["artist-credit"] || [])[0]?.name || "", year: yearOf(g["first-release-date"]), source: "musicbrainz",
    src: `https://coverartarchive.org/release-group/${g.id}/front-250`, url: "https://musicbrainz.org/release-group/" + g.id }));
}
const RANK = ["spotify", "itunes", "discogs", "musicbrainz"]; // whose cover and link win when sources agree
async function searchAlbums(q){
  const lists = await Promise.all([fromSpotify, fromItunes, fromDiscogs, fromMusicBrainz].map(f => within(f(q))));
  const byKey = new Map(), words = norm(q).split(" ").filter(Boolean);
  lists.flat().forEach((r, i) => {
    if (!r.name) return;
    const key = resultKey(r.name, r.artist);
    let m = byKey.get(key);
    if (!m){
      const hay = " " + norm(cleanTitle(r.name) + " " + r.artist) + " ";
      const match = words.filter(w => hay.includes(" " + w)).length / (words.length || 1);
      byKey.set(key, m = { key, name: cleanTitle(r.name) || r.name, artist: r.artist, year: r.year, src: "", url: "", spotify: false, sources: new Set(), match, i });
    }
    m.sources.add(r.source);
    if (r.source === "spotify") m.spotify = true;
    if (r.year && (!m.year || r.year < m.year)) m.year = r.year; // the original release
    const better = s => !m.from || RANK.indexOf(s) < RANK.indexOf(m.from);
    if (r.src && better(r.source)){ m.src = r.src; m.url = r.url || m.url; m.from = r.source; }
    if (!m.url) m.url = r.url;
  });
  // best match to what was typed first, then albums more sources agree on, then the order they came in
  return [...byKey.values()].sort((a, b) => b.match - a.match || b.sources.size - a.sources.size || a.i - b.i).slice(0, 40)
    .map(({ key, name, artist, year, src, url, spotify }) => ({ key, name, artist, year, src, url, spotify }));
}
function qtile(it){
  const t = document.createElement("div");
  t.className = "qtile"; t.dataset.key = it.key; t.title = it.name + (it.artist ? " · " + it.artist : "");
  const label = document.createElement("i"); label.textContent = it.name; t.appendChild(label);
  if (it.src){
    // the name sits underneath in case there's no cover; the cover fades in over it
    label.style.opacity = 0;
    const img = new Image(); img.alt = ""; img.loading = "lazy"; img.draggable = false;
    img.onload = () => img.classList.add("in");
    img.onerror = () => { img.remove(); label.style.opacity = ""; };
    img.src = it.src; t.appendChild(img);
  }
  t.appendChild(Object.assign(document.createElement("b"), { textContent: "✓" }));
  return t;
}
let qResults = null, qSeq = 0, qTimer = 0;
function renderQueue(){
  const body = $("#qbody"), frag = document.createDocumentFragment(), note = text => { const p = document.createElement("p"); p.className = "qnote"; p.textContent = text; frag.appendChild(p); };
  if (qResults){
    // search results: click to add to the queue, click again to take it back out
    const inQ = new Set(queueList().map(x => x.key));
    if (!qResults.length) note("Nothing found.");
    else {
      const grid = document.createElement("div"); grid.className = "qgrid qres";
      for (const it of qResults){
        const cell = document.createElement("div"); cell.dataset.key = it.key;
        const t = qtile(it); t.classList.toggle("on", inQ.has(it.key));
        const cap = document.createElement("div"); cap.className = "qcap";
        const n = document.createElement("div"); n.textContent = it.name;
        const sub = document.createElement("div"); sub.className = "sub";
        sub.textContent = [it.artist, it.year, it.spotify ? "" : "not on Spotify"].filter(Boolean).join(" · ");
        cap.append(n, sub); cell.append(t, cap); grid.appendChild(cell);
      }
      frag.appendChild(grid);
    }
  } else {
    const list = queueList();
    if (!list.length) note("Search for an album to add it to your queue.");
    else {
      const grid = document.createElement("div"); grid.className = "qgrid qlist";
      for (const it of list) grid.appendChild(qtile(it));
      frag.appendChild(grid);
    }
  }
  body.replaceChildren(frag);
}
$("#qsearch").addEventListener("input", () => {
  clearTimeout(qTimer);
  const q = $("#qsearch").value.trim(), seq = ++qSeq;
  if (!q){ qResults = null; renderQueue(); return; }
  qTimer = setTimeout(async () => {
    const res = await searchAlbums(q);
    if (seq !== qSeq) return; // a newer search has started
    qResults = res; window.scrollTo(0, 0); renderQueue();
  }, 450);
});
$("#qsearch").addEventListener("keydown", e => { if (e.key === "Escape" && e.target.value){ e.target.value = ""; e.target.dispatchEvent(new Event("input")); } });

// The Spotify version of a Discogs record, so the Pantheon shows clean Spotify art instead of a
// photo of the sleeve. Remembered per record (null when Spotify doesn't have it).
const waxMatches = {};
function spotifyFor(rec){
  const known = LS.get("wax.spotify", {});
  if (rec.id in known) return Promise.resolve(known[rec.id]);
  return waxMatches[rec.id] ||= findOnSpotify(rec).then(al => {
    const k = LS.get("wax.spotify", {}); k[rec.id] = al; LS.set("wax.spotify", k);
    return al;
  }).finally(() => delete waxMatches[rec.id]);
}
async function findOnSpotify(rec){
  const [t, ...rest] = (rec.title || "").split(" · ");
  const title = cleanTitle(rec.album ?? t), artist = ((rec.artist ?? rest.join(" · ")).split(", ")[0] || "");
  const various = /^various$/i.test(artist);
  const want = norm(title), who = norm(artist);
  const tries = [`album:"${title}"` + (various ? "" : ` artist:"${artist}"`), title + (various ? "" : " " + artist)];
  for (const q of tries){
    const j = await api("/search?type=album&limit=10&q=" + encodeURIComponent(q));
    const items = (j.albums?.items || []).filter(a => a && (a.images || []).length);
    const artistOk = a => various || (a.artists || []).some(x => { const n = norm(x.name || ""); return n === who || n.includes(who) || who.includes(n); });
    const titleOk = a => { const n = norm(cleanTitle(a.name || "")); return n === want || n.startsWith(want) || want.startsWith(n); };
    const hits = items.filter(a => artistOk(a) && titleOk(a));
    if (!hits.length) continue;
    // a full album over a single, and the original over a remaster or deluxe edition
    const score = a => (a.album_type === "single" ? 2 : 0) + (isReissue(a.name || "") ? 1 : 0);
    const a = hits.sort((x, y) => score(x) - score(y))[0];
    const imgs = a.images || [];
    const src = (imgs.find(i => i.width && i.width <= 320 && i.width >= 250) || imgs[0]).url;
    return { id: a.id, ids: [a.id], src, title: a.name + " · " + (a.artists || []).map(x => x.name).join(", "), artist: (a.artists || [])[0]?.name || "" };
  }
  return null;
}

/* ---------- decades ---------- */
const dec = $("#decades");
let setW = 0;            // width of one full run of decade columns
const colTop = {};       // remembered scroll position of each decade column
const expected = new WeakMap(); // scroll positions we set ourselves (so copies don't echo back)
let decTimer = 0;
let centerNext = true;   // opening Decades starts with the 2020s in the middle of the screen
// tidy up years saved by the old MusicBrainz lookup
try{ for (const k of Object.keys(localStorage)) if (k.startsWith("wall.orig.")) localStorage.removeItem(k); }catch{}
let loaded = false; // decades are laid out once everything has loaded, so nothing moves around
function scheduleDecades(wait = 250){ clearTimeout(decTimer); decTimer = setTimeout(() => drag ? scheduleDecades(wait) : renderDecades(), wait); }

function decadeGroups(){
  const g = new Map();
  for (const a of albums){
    if (!a.year) continue;
    const d = Math.floor(a.year / 10) * 10;
    if (!g.has(d)) g.set(d, []);
    g.get(d).push(a);
  }
  return [...g.keys()].sort((x, y) => x - y).map(d => [d, g.get(d)]);
}
// each decade is either in release order (white) or your own ranking (yellow, draggable)
const isRanked = d => LS.get("mode." + d) === "rank";
// release order, newest first (same-day releases go A to Z)
function chronological(list){
  const when = a => a.year + (a.year === a.released ? a.date.slice(4) : "");
  return [...list].sort((x, y) => when(y).localeCompare(when(x)) || x.name.toLowerCase().localeCompare(y.name.toLowerCase()));
}
// albums you've dragged keep your order; albums new since then sit at the top
function ranked(d, list){
  const pos = new Map(LS.get("order." + d, []).map((id, i) => [id, i]));
  // an album is known by any of its versions' ids, so a ranking survives a remaster being swapped for the original
  const at = a => Math.min(...a.ids.map(id => pos.has(id) ? pos.get(id) : Infinity));
  return [...list.filter(a => at(a) === Infinity), ...list.filter(a => at(a) < Infinity).sort((x, y) => at(x) - at(y))];
}
function fillTiles(tiles, d, list){
  tiles.textContent = "";
  for (const a of isRanked(d) ? ranked(d, list) : chronological(list)){
    const img = document.createElement("img");
    img.src = a.src; img.alt = ""; img.title = a.title; img.dataset.id = a.id; img.draggable = false; img.loading = "lazy";
    tiles.appendChild(img);
  }
}
function column(d, list){
  const col = document.createElement("section");
  col.className = "col" + (isRanked(d) ? " rank" : ""); col.dataset.decade = d;
  const h = document.createElement("h2");
  h.innerHTML = titleSvg(String(d));
  const tiles = document.createElement("div"); tiles.className = "tiles";
  fillTiles(tiles, d, list);
  col.append(h, tiles);
  return col;
}
// the decade title is drawn as just the ink of its digits, stretched to fill the title cell
const inkCtx = document.createElement("canvas").getContext("2d");
function titleSvg(text){
  inkCtx.font = '700 26px "Helvetica Neue",Helvetica,Arial,sans-serif';
  const m = inkCtx.measureText(text);
  const box = [-m.actualBoundingBoxLeft, -m.actualBoundingBoxAscent,
    m.actualBoundingBoxLeft + m.actualBoundingBoxRight, m.actualBoundingBoxAscent + m.actualBoundingBoxDescent];
  return `<svg viewBox="${box.join(" ")}" preserveAspectRatio="none" aria-label="${text}s"><text x="0" y="0"><tspan class="cent">${text.slice(0, 2)}</tspan>${text.slice(2)}</text></svg>`;
}
function renderDecades(){
  const groups = decadeGroups();
  const offset = setW ? (dec.scrollLeft - setW) : 0;
  dec.innerHTML = "";
  if (!loaded){ setW = 0; dec.innerHTML = ""; return; }
  if (!groups.length){ setW = 0; dec.innerHTML = albums.length ? '<p class="empty">No release years found.</p>' : ""; return; }
  const set = () => { const f = document.createDocumentFragment(); for (const [d, list] of groups) f.appendChild(column(d, list)); return f; };
  dec.appendChild(set());
  const first = dec.firstElementChild;
  setW = groups.length * (first.offsetWidth + parseFloat(getComputedStyle(dec).columnGap || 4));
  // enough copies that we can always keep the view inside the second copy and still fill the screen
  const copies = 3 + Math.ceil(dec.clientWidth / setW);
  for (let i = 1; i < copies; i++) dec.appendChild(set());
  for (const c of dec.children){ const t = colTop[c.dataset.decade]; if (t){ expected.set(c, c.scrollTop = t); } }
  if (centerNext){
    // put the 2020s (or the latest decade, if there's nothing from the 2020s) in the middle, in the second copy
    centerNext = false;
    const ds = groups.map(([d]) => +d), i = ds.includes(2020) ? ds.indexOf(2020) : ds.indexOf(Math.max(...ds));
    const c = dec.children[groups.length + i];
    let x = c.offsetLeft + c.offsetWidth / 2 - dec.clientWidth / 2;
    if (x < setW) x += setW;
    dec.scrollLeft = x;
  } else dec.scrollLeft = setW + Math.max(0, Math.min(offset, setW - 1));
}
function wrap(){
  if (!setW) return;
  if (dec.scrollLeft < setW) dec.scrollLeft += setW;
  else if (dec.scrollLeft >= 2 * setW) dec.scrollLeft -= setW;
}
dec.addEventListener("scroll", e => {
  const c = e.target;
  if (c === dec) return wrap();
  if (!c.classList || !c.classList.contains("col")) return;
  if (expected.has(c) && Math.abs(expected.get(c) - c.scrollTop) < 1){ expected.delete(c); return; }
  expected.delete(c);
  colTop[c.dataset.decade] = c.scrollTop;
  for (const o of dec.querySelectorAll(`.col[data-decade="${c.dataset.decade}"]`))
    if (o !== c && Math.abs(o.scrollTop - c.scrollTop) >= 1){ o.scrollTop = c.scrollTop; expected.set(o, o.scrollTop); }
}, true);
// with the mouse over the decade titles, the wheel scrolls the decades sideways
dec.addEventListener("wheel", e => {
  if (!e.target.closest(".col h2") || e.ctrlKey) return;
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  dec.scrollLeft += d * (e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? dec.clientWidth : 1);
}, { passive: false });
dec.addEventListener("click", e => {
  const h = e.target.closest(".col h2");
  if (!h) return;
  // switch this decade between release order and your ranking, go back to the top, and bring it to the middle
  const col = h.parentElement, d = col.dataset.decade;
  showDecade(d, !isRanked(d));
  glideTo(col.offsetLeft + col.offsetWidth / 2 - dec.clientWidth / 2);
});
// slide the decades sideways to x
let glide = 0;
function glideTo(x){
  cancelAnimationFrame(glide);
  const from = dec.scrollLeft, dist = x - from, t0 = performance.now(), ms = 450;
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), k = 1 - Math.pow(1 - t, 3);
    dec.scrollLeft = from + dist * k;
    if (t < 1) glide = requestAnimationFrame(step); else { glide = 0; wrap(); }
  };
  glide = requestAnimationFrame(step);
}
// when Decades sits idle, drift slowly to the right; any touch of the mouse, keys or screen stops it
const IDLE_MS = 3000, DRIFT = 36; // px per second
let lastInput = performance.now(), driftAt = 0, driftX = 0;
for (const ev of ["pointermove", "pointerdown", "wheel", "keydown", "touchstart"])
  addEventListener(ev, () => { lastInput = performance.now(); driftAt = 0; }, { passive: true, capture: true });
requestAnimationFrame(function drift(now){
  requestAnimationFrame(drift);
  if (view !== "decades" || !setW || glide || drag || !menu.classList.contains("hidden") || now - lastInput < IDLE_MS){ driftAt = 0; return; }
  if (!driftAt || Math.abs(driftX - dec.scrollLeft) > 2) driftX = dec.scrollLeft; // start from wherever it is now
  if (driftAt) driftX += DRIFT * Math.min(100, now - driftAt) / 1000;
  driftAt = now;
  dec.scrollLeft = driftX;
  if (dec.scrollLeft >= 2 * setW){ wrap(); driftX = dec.scrollLeft; }
});
function showDecade(d, rank){
  LS.set("mode." + d, rank ? "rank" : "chrono");
  const list = albums.filter(a => a.year && Math.floor(a.year / 10) * 10 === +d);
  for (const c of dec.querySelectorAll(`.col[data-decade="${d}"]`)){
    c.classList.toggle("rank", rank);
    fillTiles(c.querySelector(".tiles"), d, list);
    c.scrollTop = 0; expected.set(c, 0);
  }
  colTop[d] = 0;
}

/* right-click any album, on any page: rank it in its decade, or send it to the Pantheon */
const menu = $("#menu");
let menuFor = null;
function closeMenu(){ menu.classList.add("hidden"); menuFor = null; }
const decadeOf = a => a.year ? Math.floor(a.year / 10) * 10 : null;
document.addEventListener("contextmenu", e => {
  const tile = e.target.closest("#wall img, #pantheon img, .tiles img, #wax img");
  if (!tile) return;
  e.preventDefault();
  if (drag) return;
  // a Wax record stands in for its Spotify version, which is looked up straight away
  const rec = tile.closest("#wax") && (LS.get(WAX)?.list || []).find(r => r.id === tile.dataset.id);
  if (rec) rec.wax = true;
  const album = rec || (tile.closest("#pantheon") ? byAnyId(tile.dataset.id) : albums.find(a => a.id === tile.dataset.id));
  if (!album) return;
  menuFor = album;
  const d = rec ? null : decadeOf(album);
  menu.querySelector('[data-act="top"]').classList.toggle("hidden", !d);
  menu.querySelector('[data-act="end"]').classList.toggle("hidden", !d);
  const pb = menu.querySelector('[data-act="pantheon"]');
  pb.disabled = false;
  const known = rec && LS.get("wax.spotify", {})[rec.id];
  pb.textContent = (rec ? known && inPantheon(byAnyId(known.id) || known) : inPantheon(album)) ? "Remove From Pantheon" : "Send To Pantheon";
  if (rec) spotifyFor(rec).catch(() => {});
  menu.classList.remove("hidden");
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(e.clientX, innerWidth - w - 4) + "px";
  menu.style.top = Math.min(e.clientY, innerHeight - h - 4) + "px";
});
menu.onclick = e => {
  const act = e.target.closest("button")?.dataset.act, album = menuFor;
  if (!act || !album) return;
  if (act === "pantheon" && album.wax){
    const btn = e.target.closest("button");
    if (btn.disabled) return;
    btn.disabled = true;
    spotifyFor(album).then(al => {
      if (menuFor !== album) return;
      if (!al){ btn.textContent = "Not Found On Spotify"; return; }
      closeMenu(); togglePantheon(byAnyId(al.id) || al); // your own copy of it, if you have one
    }, () => { if (menuFor === album) btn.textContent = "Spotify Didn't Answer"; });
    return;
  }
  closeMenu();
  if (act === "pantheon"){ togglePantheon(album); return; }
  rankEdge(act, album);
};
function togglePantheon(album){
  // new arrivals wait in the queue; removing takes it out of the queue or its place
  const p = pantheon(), was = inPantheon(album);
  p.queue = p.queue.filter(id => !album.ids.includes(id));
  p.slots = p.slots.map(id => id && album.ids.includes(id) ? null : id);
  if (!was) p.queue.push(album.id);
  // a Spotify album that isn't one of yours is kept alongside, so the Pantheon can draw it
  if (!was && !albums.some(a => a.ids.includes(album.id))){ const x = extras(); x[album.id] = album; LS.set("pantheon.extra", x); }
  savePantheon(p);
  if (view === "pantheon") renderPantheon();
}
function rankEdge(act, album){
  // Send To Top 10 / Send To End: move it to the first or last place in its decade's ranking
  const d = decadeOf(album), id = album.id;
  const list = albums.filter(a => decadeOf(a) === d);
  const before = ranked(d, list).map(a => a.id), rest = before.filter(x => x !== id);
  LS.set("order." + d, act === "top" ? [id, ...rest] : [...rest, id]);
  if (view !== "decades" || !isRanked(d)) return; // not on screen as a ranking: it changes quietly
  // stay where you are: when it goes to the top, the albums above it each slide down a place,
  // so scroll down a place too; when it goes to the end, the albums above it don't move
  const moved = act === "top" && before.indexOf(id) > 0;
  for (const c of dec.querySelectorAll(`.col[data-decade="${d}"]`)){
    const tiles = c.querySelector(".tiles"), step = moved ? tiles.firstElementChild.offsetHeight + 4 : 0, top = c.scrollTop;
    fillTiles(tiles, d, list);
    c.scrollTop = top + step; expected.set(c, c.scrollTop);
    colTop[d] = c.scrollTop;
  }
}
addEventListener("pointerdown", e => { if (!e.target.closest("#menu")) closeMenu(); }, true);
addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
addEventListener("wheel", closeMenu, { passive: true });
addEventListener("blur", closeMenu);
addEventListener("resize", () => { if (view === "decades") scheduleDecades(); });

/* drag an album up or down its own column */
let pending = null, drag = null;
dec.addEventListener("pointerdown", e => {
  const tile = e.target.closest(".col.rank .tiles img");
  if (!tile || e.button > 0 || drag) return;
  if (e.pointerType === "mouse") e.preventDefault();
  const p = pending = { tile, x: e.clientX, y: e.clientY, touch: e.pointerType !== "mouse" };
  // on touch, press and hold to pick an album up; a plain swipe still scrolls
  if (p.touch) p.timer = setTimeout(() => { if (pending === p) beginDrag(p); }, 300);
});
addEventListener("pointermove", e => {
  if (drag){ drag.x = e.clientX; drag.y = e.clientY; return; }
  if (!pending) return;
  if (Math.hypot(e.clientX - pending.x, e.clientY - pending.y) > 6){
    if (pending.touch){ clearTimeout(pending.timer); pending = null; }
    else { pending.x = e.clientX; pending.y = e.clientY; beginDrag(pending); }
  }
});
addEventListener("pointerup", endDrag);
addEventListener("pointercancel", endDrag);
document.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });

function beginDrag(p){
  pending = null;
  const r = p.tile.getBoundingClientRect();
  const ghost = p.tile.cloneNode();
  ghost.className = "ghost";
  Object.assign(ghost.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  document.body.appendChild(ghost);
  p.tile.classList.add("placeholder");
  if (navigator.vibrate) try{ navigator.vibrate(10); }catch{}
  drag = { tile: p.tile, col: p.tile.closest(".col"), list: p.tile.parentElement, ghost, x: p.x, y: p.y, dy: p.y - r.top };
  requestAnimationFrame(dragFrame);
}
function dragFrame(){
  if (!drag) return;
  const { col, list, tile, ghost, y } = drag;
  const cr = col.getBoundingClientRect();
  const head = col.querySelector("h2").offsetHeight;
  // keep the album in its column, and scroll the column when you hold it near the top or bottom
  ghost.style.left = cr.left + "px";
  ghost.style.top = Math.max(cr.top + head, Math.min(cr.bottom - drag.ghost.offsetHeight / 2, y - drag.dy)) + "px";
  const edge = 70;
  if (y < cr.top + head + edge) col.scrollTop -= Math.ceil((cr.top + head + edge - y) / 6);
  else if (y > cr.bottom - edge) col.scrollTop += Math.ceil((y - (cr.bottom - edge)) / 6);
  // find where it would land and slide the others out of the way
  const gr = ghost.getBoundingClientRect(), mid = gr.top + gr.height / 2;
  let before = null;
  for (const el of list.children){
    if (el === tile) continue;
    const r = el.getBoundingClientRect();
    if (mid < r.top + r.height / 2){ before = el; break; }
  }
  if (tile.nextElementSibling !== before && before !== tile){
    const kids = [...list.children], old = new Map(kids.map(k => [k, k.getBoundingClientRect().top]));
    list.insertBefore(tile, before);
    for (const k of kids){
      const dy = old.get(k) - k.getBoundingClientRect().top;
      if (!dy || k === tile) continue;
      k.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 160, easing: "ease-out" });
    }
  }
  requestAnimationFrame(dragFrame);
}
function endDrag(){
  if (pending){ clearTimeout(pending.timer); pending = null; }
  if (!drag) return;
  const { tile, list, ghost, col } = drag;
  drag = null;
  const r = tile.getBoundingClientRect();
  ghost.style.transition = "top .15s, left .15s, transform .15s";
  Object.assign(ghost.style, { top: r.top + "px", left: r.left + "px", transform: "none" });
  setTimeout(() => { ghost.remove(); tile.classList.remove("placeholder"); }, 150);
  const ids = [...list.children].map(k => k.dataset.id);
  LS.set("order." + col.dataset.decade, ids);
  // the same decade appears in every copy of the loop; give them the same order
  for (const other of dec.querySelectorAll(`.col[data-decade="${col.dataset.decade}"] .tiles`)){
    if (other === list) continue;
    const byId = new Map([...other.children].map(k => [k.dataset.id, k]));
    for (const id of ids) if (byId.has(id)) other.appendChild(byId.get(id));
  }
}

function showSetup(msg){
  $("#setup").classList.remove("hidden");
  if (CLIENT_ID){ $("#clientId").value = CLIENT_ID; $("#clientId").classList.add("hidden"); $("#help").classList.add("hidden"); }
  else $("#clientId").value = LS.get("clientId") || (() => { try{ return JSON.parse(localStorage.getItem("curator.clientId")) || ""; }catch{ return ""; } })();
  $("#msg").textContent = msg || "";
  $("#redir").textContent = REDIRECT;
}
const WRONG_PLACE = location.protocol === "file:" || window.top !== window || !/^(127\.0\.0\.1|localhost)$/.test(location.hostname) && location.protocol !== "https:";
$("#form").onsubmit = async e => {
  e.preventDefault();
  const id = $("#clientId").value.trim();
  if (!id) return void ($("#msg").textContent = "Paste your Client ID first.");
  if (WRONG_PLACE) return void ($("#msg").textContent = "This page can't sign in from here. Open http://127.0.0.1:8888/ in your browser after starting the local server.");
  $("#msg").textContent = "Opening Spotify…";
  try { await startLogin(id); } catch(err){ $("#msg").textContent = "Couldn't start sign-in: " + err.message; }
};

(async () => {
  const startViews = () => { $("#views").classList.remove("hidden"); setView(view); };
  if (new URLSearchParams(location.search).has("demo")){
    const fake = Array.from({length: 240}, (_, i) => {
      const c = document.createElement("canvas"); c.width = c.height = 64;
      const g = c.getContext("2d"); g.fillStyle = `hsl(${(i * 47) % 360},45%,${35 + (i % 5) * 8}%)`; g.fillRect(0, 0, 64, 64);
      return { id: "d" + i, name: "Album " + (i + 1), artists: [{ name: "Artist" }], images: [{ url: c.toDataURL() }],
        release_date: String(1962 + (i * 37) % 64) };
    });
    fake[0].name = "Abbey Road (Remastered 2019)"; fake[0].release_date = "2019-09-27";
    fake[1].name = "Jim Hall On Guitar 1955-1962"; fake[1].release_date = "2021";
    fake[2].name = "Abbey Road"; fake[2].release_date = "1969"; fake[2].artists = fake[0].artists = [{ name: "The Beatles" }];
    fake[3].name = "Abbey Road (Super Deluxe Edition)"; fake[3].artists = [{ name: "The Beatles" }];
    const col = collector(); col.add(fake); albums = col.list;
    startViews(); ready(); return;
  }
  try { await handleRedirect(); } catch(e){ return showSetup(e.message); }
  if (!LS.get("token")) return showSetup();
  startViews();
  const cached = LS.get(CACHE);
  if (Array.isArray(cached) && cached.length){
    // show last visit's albums straight away; fetch a fresh list quietly for next time, so nothing moves now
    albums = cached; ready();
    const col = collector();
    load(col).then(() => { if (col.list.length) LS.set(CACHE, col.list); })
      .catch(e => { if (e.status === 401 || e.status === 403) LS.del("token"); });
    return;
  }
  try {
    $("#loading").classList.remove("hidden");
    const col = collector(); await load(col);
    albums = col.list; LS.set(CACHE, albums); ready();
  }
  catch(e){ LS.del("token"); $("#wall").innerHTML = ""; dec.innerHTML = ""; $("#loading").classList.add("hidden"); albums = []; $("#views").classList.add("hidden"); $("#decades").classList.add("hidden"); document.body.classList.remove("decade-view"); showSetup(e.message); }
})();
</script>
