<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wikipedia check</title>
<style>
html,body{margin:0;background:#0b0b0c;color:#e9e9ea;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.row{padding:12px 0;border-bottom:1px solid #222}
.row b{font-weight:600}.row a{color:#1ed760}.m{color:#8a8a90}
</style>
</head>
<body>
<main id="out"><p class="m">Looking up a few well-known albums on Wikipedia…</p></main>
<script src="wiki.js"></script>
<script>
const albums = [
  ["OK Computer", "Radiohead"], ["Blue", "Joni Mitchell"], ["Abbey Road (Remastered 2019)", "The Beatles"],
  ["Rumours", "Fleetwood Mac"], ["1989 (Taylor's Version)", "Taylor Swift"], ["Kind Of Blue (Legacy Edition)", "Miles Davis"],
  ["To Pimp A Butterfly", "Kendrick Lamar"], ["Random Access Memories", "Daft Punk"], ["Blonde", "Frank Ocean"]
].map(([name, artist], i) => ({ id: "test" + i, name, artists: [{ name: artist }] }));
const out = document.getElementById("out"); out.innerHTML = "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
Wiki.lookupAll(albums, (a, w) => {
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = w
    ? `<b>${esc(a.name)}</b> <span class="m">· ${esc(a.artists[0].name)}</span><br>
       <a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.title)}</a> <span class="m">· ${esc(w.released)} · ${esc(w.type)}</span><br>
       Genres: ${esc(w.genres.join(", "))}<br>Label: ${esc(w.labels.join(", "))}<br>Producer: ${esc(w.producers.join(", "))}`
    : `<b>${esc(a.name)}</b> <span class="m">· no Wikipedia match</span>`;
  out.appendChild(d);
});
</script>
</body>
</html>
